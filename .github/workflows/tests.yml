name: tests

on:
  push:
  pull_request:

jobs:
  # CPU backend: C++ unit tests and python tests
  # (GitHub-hosted runners have no GPU; test the CUDA backend locally)
  cpu:
    name: cpu (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest       # linux-64
          - os: ubuntu-24.04-arm    # linux-aarch64
          - os: macos-15-intel      # osx-64
            extra: llvm-openmp
          - os: macos-15            # osx-arm64
            extra: llvm-openmp
    defaults:
      run:
        shell: bash -el {0}
    env:
      OMP_NUM_THREADS: 4
    steps:
      - uses: actions/checkout@v7
      - uses: conda-incubator/setup-miniconda@v4
        with:
          miniforge-version: latest
          conda-remove-defaults: true
          activate-environment: pycuampcor
      - name: Install dependencies
        run: >
          conda install -y -c conda-forge python=3.12 cmake ninja cxx-compiler fftw hdf5 zlib gdal pybind11 gtest
          scikit-build-core pip numpy pytest h5py matplotlib ${{ matrix.extra }}
      - name: C++ unit tests
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DPYCUAMPCOR_CUDA=OFF -DPYCUAMPCOR_HDF5=ON -DPYCUAMPCOR_GDAL=ON \
            -DPYCUAMPCOR_BUILD_TESTS=ON -DCMAKE_PREFIX_PATH=$CONDA_PREFIX -DPython_EXECUTABLE=$(which python)
          cmake --build build
          ctest --test-dir build --output-on-failure
      - name: Python tests
        run: |
          pip install . -v --no-deps --no-build-isolation -Ccmake.define.PYCUAMPCOR_CUDA=OFF -Ccmake.define.PYCUAMPCOR_HDF5=ON -Ccmake.define.PYCUAMPCOR_GDAL=ON
          pytest -v tests/python
      - name: Type stubs
        run: |
          pip install mypy
          python -m mypy.stubtest pycuampcor._cpu --allowlist tests/python/stubtest_allowlist.txt --ignore-unused-allowlist
