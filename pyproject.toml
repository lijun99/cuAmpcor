[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.10"]
build-backend = "scikit_build_core.build"

[project]
name = "pycuampcor"
dynamic = ["version"]
description = "Amplitude cross-correlation (ampcor) for SAR images with CPU (OpenMP) and CUDA backends"
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.8"
dependencies = []

[project.optional-dependencies]
test = ["pytest", "numpy"]

[project.urls]
Homepage = "https://github.com/lijun99/cuAmpcor"

[tool.scikit-build]
cmake.version = ">=3.18"
cmake.build-type = "Release"
sdist.include = ["cxx", "python", "cmake", "tests"]
wheel.packages = ["python/packages/pycuampcor"]
metadata.version.provider = "scikit_build_core.metadata.regex"
metadata.version.input = "CMakeLists.txt"
metadata.version.regex = 'project\(pycuampcor VERSION (?P<value>[0-9.]+)'

# build options, e.g., pip install . -Ccmake.define.PYCUAMPCOR_CUDA=OFF
[tool.scikit-build.cmake.define]
PYCUAMPCOR_CUDA = "AUTO"

[tool.pytest.ini_options]
testpaths = ["tests/python"]
